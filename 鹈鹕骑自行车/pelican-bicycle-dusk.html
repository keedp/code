<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>暮色骑行 · Pelican at Dusk</title>
<style>
  :root{
    --night:#2a3550;
    --dusk:#f0a25f;
    --cream:#fdf3df;
    --coral:#e8734f;
    --teal:#2c7a72;
    --ink:#23303a;
  }

  *{ box-sizing:border-box; }

  html,body{
    height:100%;
    margin:0;
    overflow:hidden;
    background:#2b3350;
    color:var(--cream);
    font-family:"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .stage{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    isolation:isolate;
  }

  #scene{
    display:block;
    width:100%;
    height:100%;
    background:linear-gradient(#2b3556,#e8a06a 62%,#f6d3a0);
  }

  .vignette{
    position:absolute;
    inset:0;
    z-index:2;
    pointer-events:none;
    background:
      radial-gradient(115% 90% at 50% 45%, transparent 58%, rgba(20,26,44,.34) 100%),
      linear-gradient(180deg, rgba(24,30,52,.30), transparent 34%, transparent 78%, rgba(30,32,46,.22));
  }

  .masthead{
    position:absolute;
    z-index:3;
    top:clamp(22px,4.4vw,56px);
    left:clamp(22px,4.8vw,66px);
    max-width:min(430px,72vw);
    pointer-events:none;
  }

  .kicker{
    display:flex;
    align-items:center;
    gap:12px;
    margin:0 0 12px;
    font-size:11px;
    font-weight:700;
    letter-spacing:.26em;
    color:#f3c795;
    text-transform:uppercase;
  }

  .kicker::before{
    content:"";
    width:34px;
    height:1.5px;
    border-radius:2px;
    background:var(--dusk);
  }

  h1{
    margin:0;
    font-family:"Bodoni 72","Didot","Songti SC","STSong","Times New Roman",serif;
    font-size:clamp(31px,4.4vw,55px);
    font-weight:600;
    line-height:1.05;
    letter-spacing:.06em;
    color:#fff4e2;
    text-shadow:0 2px 18px rgba(60,40,50,.35);
  }

  .subtitle{
    margin:12px 0 0;
    font-size:clamp(11px,1.1vw,13.5px);
    line-height:1.7;
    letter-spacing:.08em;
    color:#f7dcc0;
    opacity:.9;
  }

  .subtitle span{
    display:inline-block;
    margin-right:.4em;
    font-size:.82em;
    letter-spacing:.22em;
    color:#e7b98e;
  }

  .controls{
    position:absolute;
    z-index:4;
    right:clamp(18px,3.6vw,52px);
    bottom:clamp(18px,3.4vw,44px);
    display:flex;
    align-items:center;
    gap:14px;
  }

  .hint{
    font-size:10.5px;
    letter-spacing:.14em;
    color:rgba(255,240,218,.66);
  }

  .pause-button{
    appearance:none;
    border:1.5px solid rgba(255,226,190,.62);
    border-radius:999px;
    background:rgba(38,44,68,.5);
    color:#fff3df;
    min-width:118px;
    height:48px;
    padding:0 21px 0 17px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font:600 13px/1 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    letter-spacing:.12em;
    cursor:pointer;
    box-shadow:0 7px 22px rgba(18,22,40,.34), inset 0 1px 0 rgba(255,240,215,.16);
    backdrop-filter:blur(9px);
    -webkit-backdrop-filter:blur(9px);
    transition:transform .2s ease, background .2s ease;
    -webkit-tap-highlight-color:transparent;
  }

  .pause-button:hover{
    background:rgba(52,58,86,.72);
    transform:translateY(-2px);
  }

  .pause-button:active{ transform:translateY(0); }
  .pause-button:focus-visible{ outline:2.5px solid var(--dusk); outline-offset:4px; }

  .pause-button svg{
    width:15px;
    height:15px;
    flex:0 0 auto;
    fill:currentColor;
  }

  .pause-button .icon-play{ display:none; }
  .is-paused .pause-button .icon-pause{ display:none; }
  .is-paused .pause-button .icon-play{ display:block; }

  /* ---------- ambient CSS animation ---------- */
  .cloud-drift{
    animation:cloudDrift 27s ease-in-out infinite alternate;
    transform-box:fill-box;
    transform-origin:center;
  }

  .cloud-drift.slow{ animation-duration:36s; animation-delay:-11s; }

  @keyframes cloudDrift{
    from{ transform:translateX(-9px); }
    to{ transform:translateX(22px); }
  }

  .gull{
    animation:gullFloat 6s ease-in-out infinite;
    transform-box:fill-box;
    transform-origin:center;
  }

  .gull.g2{ animation-duration:7.4s; animation-delay:-2.6s; }
  .gull.g3{ animation-duration:5.2s; animation-delay:-1.3s; }

  @keyframes gullFloat{
    0%,100%{ transform:translate(0,0); }
    50%{ transform:translate(-9px,-6px); }
  }

  .wave{
    animation:waveDash 9s linear infinite;
  }

  .wave.w2{ animation-duration:12s; animation-delay:-3.4s; }
  .wave.w3{ animation-duration:15s; animation-delay:-6.8s; }

  @keyframes waveDash{
    to{ stroke-dashoffset:-130; }
  }

  .beam{
    animation:beamSweep 11s ease-in-out infinite alternate;
    transform-box:view-box;
    transform-origin:154px 336px;
  }

  @keyframes beamSweep{
    from{ transform:rotate(-18deg); opacity:.5; }
    to{ transform:rotate(9deg); opacity:.9; }
  }

  .bulb{
    animation:bulbPulse 2.4s ease-in-out infinite;
  }

  @keyframes bulbPulse{
    0%,100%{ opacity:.55; }
    50%{ opacity:1; }
  }

  .shimmer{
    animation:shimmer 4.6s ease-in-out infinite;
    transform-box:fill-box;
    transform-origin:center;
  }

  .shimmer.s2{ animation-duration:6.2s; animation-delay:-1.8s; }
  .shimmer.s3{ animation-duration:5.4s; animation-delay:-3.1s; }

  @keyframes shimmer{
    0%,100%{ opacity:.25; transform:scaleX(.86); }
    50%{ opacity:.72; transform:scaleX(1.06); }
  }

  #headGroup{
    animation:headBob 3.6s ease-in-out infinite;
    transform-box:view-box;
    transform-origin:720px 305px;
  }

  @keyframes headBob{
    0%,100%{ transform:rotate(-.7deg) translateY(0); }
    50%{ transform:rotate(.8deg) translateY(-2.2px); }
  }

  #eyeBlink{
    animation:blink 7.2s infinite;
    transform-box:view-box;
    transform-origin:753px 243px;
  }

  @keyframes blink{
    0%,42%,47%,100%{ transform:scaleY(1); }
    44%,45%{ transform:scaleY(.08); }
  }

  #pouch{
    animation:pouchSway 2.9s ease-in-out infinite;
    transform-box:view-box;
    transform-origin:790px 274px;
  }

  @keyframes pouchSway{
    0%,100%{ transform:rotate(-.6deg) scaleY(1); }
    50%{ transform:rotate(.75deg) scaleY(1.016); }
  }

  .scarf-a{
    animation:scarfA 2.5s ease-in-out infinite alternate;
    transform-box:view-box;
    transform-origin:666px 330px;
  }

  .scarf-b{
    animation:scarfB 3.05s ease-in-out infinite alternate;
    transform-box:view-box;
    transform-origin:672px 344px;
  }

  @keyframes scarfA{
    from{ transform:rotate(-1.3deg) translateY(1.6px); }
    to{ transform:rotate(1.9deg) translateY(-2.4px); }
  }

  @keyframes scarfB{
    from{ transform:rotate(1.5deg) translateY(-1.4px); }
    to{ transform:rotate(-2.1deg) translateY(2.2px); }
  }

  .speed-line{
    animation:speedLine 2s linear infinite;
    opacity:0;
  }

  .speed-line.s2{ animation-delay:-.72s; animation-duration:2.4s; }
  .speed-line.s3{ animation-delay:-1.35s; animation-duration:1.7s; }

  @keyframes speedLine{
    0%{ opacity:0; transform:translateX(26px); }
    18%{ opacity:.5; }
    100%{ opacity:0; transform:translateX(-58px); }
  }

  .dust{
    animation:dustPuff 2.9s ease-out infinite;
    transform-box:fill-box;
    transform-origin:center;
  }

  .dust.d2{ animation-delay:-.75s; }
  .dust.d3{ animation-delay:-1.5s; }
  .dust.d4{ animation-delay:-2.25s; }

  @keyframes dustPuff{
    0%{ opacity:0; transform:translate(0,0) scale(.45); }
    18%{ opacity:.30; }
    100%{ opacity:0; transform:translate(-76px,-40px) scale(1.5); }
  }

  .blade{
    animation:bladeSway 4.4s ease-in-out infinite alternate;
    transform-box:fill-box;
    transform-origin:bottom center;
  }

  .blade.b2{ animation-duration:5.3s; animation-delay:-1.5s; }
  .blade.b3{ animation-duration:3.9s; animation-delay:-2.3s; }

  @keyframes bladeSway{
    from{ transform:rotate(-2.2deg); }
    to{ transform:rotate(3deg); }
  }

  .firefly{
    animation:firefly 6.4s ease-in-out infinite;
    transform-box:fill-box;
    transform-origin:center;
  }

  .firefly.f2{ animation-duration:7.8s; animation-delay:-2.1s; }
  .firefly.f3{ animation-duration:5.7s; animation-delay:-3.6s; }
  .firefly.f4{ animation-duration:8.4s; animation-delay:-1.2s; }

  @keyframes firefly{
    0%,100%{ opacity:0; transform:translate(0,0) scale(.7); }
    30%{ opacity:.9; transform:translate(6px,-7px) scale(1); }
    60%{ opacity:.25; transform:translate(-5px,-13px) scale(.85); }
  }

  .is-paused #scene *{
    animation-play-state:paused !important;
  }

  @media (max-width:760px){
    .masthead{ top:20px; left:20px; }
    .kicker{ font-size:9px; letter-spacing:.2em; margin-bottom:9px; }
    .kicker::before{ width:24px; }
    .subtitle{ max-width:280px; line-height:1.6; }
    .subtitle span{ display:block; margin:0 0 3px; }
    .hint{ display:none; }
    .controls{ right:16px; bottom:16px; }
    .pause-button{ min-width:104px; height:44px; font-size:12px; }
  }

  @media (max-height:520px){
    .masthead{ top:16px; left:22px; }
    .kicker{ margin-bottom:7px; }
    .subtitle{ display:none; }
    .hint{ display:none; }
    .controls{ bottom:14px; right:16px; }
    .pause-button{ height:40px; min-width:100px; font-size:12px; }
  }

  /* Portrait phones: framed postcard instead of a cropped panorama. */
  body.portrait{
    background:linear-gradient(180deg,#2b3556 0%,#5c5a78 38%,#c98f6c 70%,#e9bd8c 100%);
  }

  body.portrait #scene{
    position:absolute;
    top:52%;
    left:50%;
    width:calc(100vw - 32px);
    height:auto;
    transform:translate(-50%,-50%);
    border:7px solid #fcf1dc;
    border-radius:18px;
    background:#2b3556;
    box-shadow:0 26px 60px rgba(14,18,34,.5),0 3px 0 rgba(255,244,222,.35) inset;
  }

  body.portrait .masthead{
    top:24px;
    left:20px;
    max-width:calc(100vw - 40px);
  }

  body.portrait .subtitle{
    max-width:310px;
    font-size:11.5px;
  }

  body.portrait .controls{
    left:50%;
    right:auto;
    bottom:26px;
    transform:translateX(-50%);
  }

  body.portrait .hint{ display:none; }

  body.portrait .stage::after{
    content:"天黑之前，再骑一段。";
    position:absolute;
    z-index:3;
    top:calc(52% + 164px);
    left:50%;
    transform:translateX(-50%);
    font-family:"Songti SC","STSong","Times New Roman",serif;
    font-size:13px;
    letter-spacing:.16em;
    white-space:nowrap;
    color:#f7dcc0;
    opacity:.8;
    pointer-events:none;
  }

  @media (max-height:640px){
    body.portrait .stage::after{ display:none; }
  }
</style>
</head>
<body>
<main class="stage" id="stage">
  <svg id="scene" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="sceneTitle sceneDesc" xmlns="http://www.w3.org/2000/svg">
    <title id="sceneTitle">黄昏时分，一只鹈鹕在海边骑自行车</title>
    <desc id="sceneDesc">2D 动画：落日把海面染成橙色，远处灯塔的光束缓缓扫过。鹈鹕戴着深青头盔、围着珊瑚色围巾，骑着亮着车灯的自行车沿海岸公路前行。车轮与踏板转动，双腿跟随踏板踩踏，云、海浪、路边的萤火虫缓缓移动。</desc>

    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#283257"/>
        <stop offset=".26" stop-color="#4a4a72"/>
        <stop offset=".52" stop-color="#a86f88"/>
        <stop offset=".72" stop-color="#e79a6a"/>
        <stop offset=".88" stop-color="#f6c98d"/>
        <stop offset="1" stop-color="#fbe0b4"/>
      </linearGradient>

      <radialGradient id="sunGlow" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#fff0c4" stop-opacity=".95"/>
        <stop offset=".34" stop-color="#ffc47a" stop-opacity=".55"/>
        <stop offset="1" stop-color="#ffb066" stop-opacity="0"/>
      </radialGradient>

      <radialGradient id="sunCore" cx=".42" cy=".4" r=".6">
        <stop offset="0" stop-color="#fff7da"/>
        <stop offset=".55" stop-color="#ffd486"/>
        <stop offset="1" stop-color="#ffb361"/>
      </radialGradient>

      <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#c98a72"/>
        <stop offset=".3" stop-color="#9a7386"/>
        <stop offset=".68" stop-color="#5a5f83"/>
        <stop offset="1" stop-color="#3f4a70"/>
      </linearGradient>

      <linearGradient id="sunPath" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffdda0" stop-opacity=".85"/>
        <stop offset="1" stop-color="#ffcf8e" stop-opacity="0"/>
      </linearGradient>

      <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#5b6478"/>
        <stop offset="1" stop-color="#474f66"/>
      </linearGradient>

      <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3f4a5c"/>
        <stop offset="1" stop-color="#2f3a4c"/>
      </linearGradient>

      <linearGradient id="shoulderGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#6b6355"/>
        <stop offset="1" stop-color="#4f4b45"/>
      </linearGradient>

      <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3a4454"/>
        <stop offset=".45" stop-color="#313b49"/>
        <stop offset="1" stop-color="#232b38"/>
      </linearGradient>

      <linearGradient id="bodyGrad" x1=".2" y1="0" x2=".7" y2="1">
        <stop offset="0" stop-color="#fff6e2"/>
        <stop offset=".58" stop-color="#f8e7c9"/>
        <stop offset="1" stop-color="#dcbd93"/>
      </linearGradient>

      <linearGradient id="wingGrad" x1="0" y1="0" x2=".6" y2="1">
        <stop offset="0" stop-color="#fff3dd"/>
        <stop offset=".62" stop-color="#efdbb8"/>
        <stop offset="1" stop-color="#cfae83"/>
      </linearGradient>

      <linearGradient id="beakGrad" x1="0" y1="0" x2=".8" y2="1">
        <stop offset="0" stop-color="#ffd888"/>
        <stop offset=".45" stop-color="#f9b355"/>
        <stop offset="1" stop-color="#e08f36"/>
      </linearGradient>

      <linearGradient id="pouchGrad" x1=".3" y1="0" x2=".6" y2="1">
        <stop offset="0" stop-color="#f7b872"/>
        <stop offset=".62" stop-color="#e59650"/>
        <stop offset="1" stop-color="#cd7739"/>
      </linearGradient>

      <linearGradient id="helmetGrad" x1=".1" y1="0" x2=".8" y2="1">
        <stop offset="0" stop-color="#3f8b86"/>
        <stop offset="1" stop-color="#1f5d5e"/>
      </linearGradient>

      <linearGradient id="scarfGrad" x1="0" y1="0" x2=".9" y2="1">
        <stop offset="0" stop-color="#ef7d5f"/>
        <stop offset="1" stop-color="#c34a3e"/>
      </linearGradient>

      <linearGradient id="basketGrad" x1="0" y1="0" x2=".7" y2="1">
        <stop offset="0" stop-color="#c99a62"/>
        <stop offset="1" stop-color="#a06f42"/>
      </linearGradient>

      <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#fff4cf" stop-opacity=".85"/>
        <stop offset=".5" stop-color="#ffe6ae" stop-opacity=".34"/>
        <stop offset="1" stop-color="#ffe1a2" stop-opacity="0"/>
      </linearGradient>

      <radialGradient id="lampGlow" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#fff3c8" stop-opacity=".9"/>
        <stop offset=".45" stop-color="#ffdc96" stop-opacity=".35"/>
        <stop offset="1" stop-color="#ffd489" stop-opacity="0"/>
      </radialGradient>

      <filter id="shadowBlur" x="-80%" y="-120%" width="260%" height="340%">
        <feGaussianBlur stdDeviation="12"/>
      </filter>

      <filter id="softGlow" x="-140%" y="-140%" width="380%" height="380%">
        <feGaussianBlur stdDeviation="6"/>
      </filter>

      <filter id="wideGlow" x="-90%" y="-90%" width="280%" height="280%">
        <feGaussianBlur stdDeviation="16"/>
      </filter>

      <clipPath id="basketClip">
        <path d="M874 411 L956 411 L942 470 C941 476 936 480 930 480 L890 480 C884 480 879 476 878 470 Z"/>
      </clipPath>

      <clipPath id="towerClip">
        <path d="M43 52 L72 52 L84 144 L31 144 Z"/>
      </clipPath>
    </defs>

    <!-- ================= SKY ================= -->
    <rect width="1200" height="720" fill="url(#skyGrad)"/>

    <!-- stars in the upper sky -->
    <g fill="#ffeccb">
      <circle cx="142" cy="58" r="1.5" opacity=".62"/>
      <circle cx="236" cy="112" r="1.1" opacity=".44"/>
      <circle cx="318" cy="46" r="1.3" opacity=".5"/>
      <circle cx="452" cy="88" r="1" opacity=".38"/>
      <circle cx="527" cy="38" r="1.4" opacity=".52"/>
      <circle cx="636" cy="72" r="1" opacity=".34"/>
      <circle cx="742" cy="42" r="1.2" opacity=".42"/>
      <circle cx="869" cy="96" r="1" opacity=".3"/>
      <circle cx="958" cy="52" r="1.3" opacity=".4"/>
      <circle cx="1076" cy="86" r="1.1" opacity=".34"/>
      <circle cx="1148" cy="40" r="1.4" opacity=".46"/>
      <circle cx="392" cy="140" r="1" opacity=".26"/>
      <circle cx="705" cy="128" r="1.1" opacity=".28"/>
    </g>

    <!-- setting sun, low on the left so the rider stays silhouetted -->
    <circle cx="286" cy="392" r="205" fill="url(#sunGlow)"/>
    <circle cx="286" cy="392" r="70" fill="url(#sunCore)"/>
    <circle cx="286" cy="392" r="92" fill="none" stroke="#ffe2a8" stroke-width="1.4" stroke-dasharray="2 10" opacity=".4"/>

    <!-- warm streaks across the sun -->
    <g fill="#f8c98d" opacity=".28">
      <rect x="96" y="352" width="380" height="5" rx="2.5"/>
      <rect x="140" y="378" width="300" height="3.6" rx="1.8"/>
      <rect x="112" y="404" width="356" height="4.4" rx="2.2"/>
      <rect x="166" y="428" width="246" height="3" rx="1.5"/>
    </g>

    <!-- dusk clouds -->
    <g transform="translate(492 84)" opacity=".5">
      <g class="cloud-drift">
        <path d="M0 49 C-2 28 14 15 32 22 C39 2 68 0 78 20 C96 12 115 24 114 42 C133 40 145 53 141 67 L9 67 C-1 63 -4 56 0 49 Z" fill="#f7c6a0"/>
      </g>
    </g>
    <g transform="translate(128 188) scale(.72)" opacity=".34">
      <g class="cloud-drift slow">
        <path d="M0 49 C-2 28 14 15 32 22 C39 2 68 0 78 20 C96 12 115 24 114 42 C133 40 145 53 141 67 L9 67 C-1 63 -4 56 0 49 Z" fill="#eab4a4"/>
      </g>
    </g>
    <g transform="translate(1024 206) scale(.58)" opacity=".30">
      <g class="cloud-drift slow">
        <path d="M0 49 C-2 28 14 15 32 22 C39 2 68 0 78 20 C96 12 115 24 114 42 C133 40 145 53 141 67 L9 67 C-1 63 -4 56 0 49 Z" fill="#f0bda6"/>
      </g>
    </g>

    <!-- gulls -->
    <g class="gull g1" stroke="#5a4a5e" stroke-width="2.2" fill="none" stroke-linecap="round">
      <path d="M290 236 Q299 229 307 236 Q315 228 324 233" opacity=".7"/>
    </g>
    <g class="gull g2" stroke="#5a4a5e" stroke-width="1.8" fill="none" stroke-linecap="round">
      <path d="M331 258 Q338 252 345 258 Q351 251 359 255" opacity=".5"/>
    </g>
    <g class="gull g3" stroke="#5a4a5e" stroke-width="1.4" fill="none" stroke-linecap="round">
      <path d="M257 271 Q263 266 269 271 Q275 265 281 269" opacity=".36"/>
    </g>

    <!-- ================= SEA ================= -->
    <rect x="0" y="414" width="1200" height="170" fill="url(#seaGrad)"/>

    <!-- sun reflection on water -->
    <path d="M286 414 L366 585 L206 585 Z" fill="url(#sunPath)" opacity=".5"/>
    <g fill="#ffe2ad">
      <rect class="shimmer" x="252" y="436" width="70" height="3.4" rx="1.7" opacity=".55"/>
      <rect class="shimmer s2" x="234" y="460" width="104" height="3" rx="1.5" opacity=".46"/>
      <rect class="shimmer s3" x="262" y="484" width="58" height="2.6" rx="1.3" opacity=".42"/>

        <g id="scarfCollar">
          <path d="M665 320 C683 332 705 339 728 336 C738 334 746 339 744 347 C742 357 724 362 707 358 C688 353 670 343 659 332 Z" fill="#d15c4b" stroke="#161d29" stroke-width="3.2" stroke-linejoin="round"/>
          <path d="M728 336 C738 334 746 339 744 347 C742 353 735 357 727 358 C731 350 731 343 728 336 Z" fill="#ad4036" stroke="#161d29" stroke-width="2.7" stroke-linejoin="round"/>
          <path d="M674 327 C692 337 711 342 731 339" fill="none" stroke="#f7b195" stroke-width="2" stroke-linecap="round" opacity=".75"/>
          <path d="M659 332 C647 331 639 338 636 347 C648 346 657 342 664 337 Z" fill="#ad4036" stroke="#161d29" stroke-width="2.7" stroke-linejoin="round"/>
          <circle cx="664" cy="334" r="9" fill="#d15c4b" stroke="#161d29" stroke-width="3"/>
          <circle cx="661.5" cy="331" r="2.3" fill="#ffd0b3" opacity=".75"/>
        </g>
      </g>

      <!-- speed lines and dust -->
      <g stroke="#ffe6bb" stroke-width="3" stroke-linecap="round" fill="none">
        <path class="speed-line" d="M356 436 L397 436"/>
        <path class="speed-line s2" d="M340 470 L379 470"/>
        <path class="speed-line s3" d="M368 510 L399 510"/>
      </g>
      <g fill="#c9b596" opacity=".4">
        <circle class="dust" cx="414" cy="655" r="6"/>
        <circle class="dust d2" cx="430" cy="662" r="4.2"/>
        <circle class="dust d3" cx="405" cy="648" r="4.8"/>
        <circle class="dust d4" cx="440" cy="657" r="3.4"/>
      </g>
    </g>

    <!-- near blades frame the bottom -->
    <g fill="#1f3040" opacity=".7">
      <path class="blade" d="M16 720 C18 694 28 676 43 664 C35 686 32 704 31 720 Z"/>
      <path class="blade b2" d="M34 720 C39 699 56 681 74 673 C61 692 49 706 45 720 Z"/>
      <path class="blade b3" d="M55 720 C56 702 63 686 77 675 C71 694 68 707 68 720 Z"/>
      <path class="blade b2" d="M1145 720 C1141 699 1133 684 1119 672 C1127 692 1132 707 1133 720 Z"/>
      <path class="blade" d="M1166 720 C1162 696 1150 677 1136 666 C1146 688 1151 705 1152 720 Z"/>
    </g>
  </svg>

  <div class="vignette" aria-hidden="true"></div>

  <header class="masthead">
    <p class="kicker">Dusk Postcard · No. 12</p>
    <h1>暮色骑行</h1>
    <p class="subtitle"><span>PELICAN AT DUSK</span>落日沉进海里之前，它还想再骑一段路。</p>
  </header>

  <div class="controls">
    <span class="hint">SPACE 暂停 / 继续</span>
    <button class="pause-button" id="toggle" type="button" aria-label="暂停动画" title="暂停 / 继续（空格）">
      <svg class="icon-pause" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.6" height="12" rx="1.4"/><rect x="9.4" y="2" width="3.6" height="12" rx="1.4"/></svg>
      <svg class="icon-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.2 2.2c0-.8.9-1.3 1.6-.9l8.1 5.4c.6.4.6 1.3 0 1.7l-8.1 5.4c-.7.5-1.6 0-1.6-.9V2.2Z"/></svg>
      <span id="toggleLabel">暂停</span>
    </button>
  </div>
</main>

<script>
(() => {
  "use strict";

  const NS = "http://www.w3.org/2000/svg";
  const stage = document.getElementById("stage");
  const scene = document.getElementById("scene");
  const toggle = document.getElementById("toggle");
  const toggleLabel = document.getElementById("toggleLabel");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

  // Portrait screens show the scene as a framed, uncropped postcard;
  // wide screens let the coastline bleed to the edges.
  function fitScene() {
    const portrait = window.innerHeight > window.innerWidth;
    document.body.classList.toggle("portrait", portrait);
    if (portrait) {
      scene.setAttribute("viewBox", "260 95 860 640");
      scene.setAttribute("preserveAspectRatio", "xMidYMid meet");
    } else {
      scene.setAttribute("viewBox", "0 0 1200 720");
      scene.setAttribute("preserveAspectRatio", "xMidYMid slice");
    }
  }
  window.addEventListener("resize", fitScene, { passive: true });
  fitScene();

  // ---------- build repeating scenery ----------
  function el(tag, attrs) {
    const node = document.createElementNS(NS, tag);
    for (const key in attrs) node.setAttribute(key, attrs[key]);
    return node;
  }

  function buildSpokes(groupId, cx, cy) {
    const group = document.getElementById(groupId);
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      const r1 = i % 3 === 0 ? 13 : 19;
      group.appendChild(el("line", {
        x1: (cx + Math.cos(a) * r1).toFixed(2),
        y1: (cy + Math.sin(a) * r1).toFixed(2),
        x2: (cx + Math.cos(a) * 84).toFixed(2),
        y2: (cy + Math.sin(a) * 84).toFixed(2),
        stroke: i % 3 === 0 ? "#efdcb8" : "#d3bd97",
        "stroke-width": i % 3 === 0 ? 1.8 : 1.2,
        "stroke-linecap": "round",
        opacity: i % 3 === 0 ? .9 : .66
      }));
    }
    group.appendChild(el("circle", {
      cx: cx + 61,
      cy: cy - 28,
      r: 4.6,
      fill: "#e8734f",
      stroke: "#161d29",
      "stroke-width": 1.6
    }));
  }
  buildSpokes("rearSpokes", 452, 556);
  buildSpokes("frontSpokes", 826, 556);

  const dashes = document.getElementById("roadDashes");
  const DASH_PERIOD = 220;
  for (let x = -DASH_PERIOD; x <= 1200 + DASH_PERIOD; x += DASH_PERIOD) {
    dashes.appendChild(el("rect", {
      x: x,
      y: 690,
      width: 106,
      height: 9,
      rx: 4.5,
      fill: "#f4e3c2",
      opacity: .4
    }));
  }

  const texture = document.getElementById("roadTexture");
  let seed = 23;
  function rand() {
    seed = (seed * 16807) % 2147483647;
    return (seed - 1) / 2147483646;
  }
  for (let i = 0; i < 80; i++) {
    texture.appendChild(el("ellipse", {
      cx: (rand() * 1200).toFixed(1),
      cy: (620 + rand() * 88).toFixed(1),
      rx: (.6 + rand() * 2.4).toFixed(1),
      ry: (.5 + rand() * 1.2).toFixed(1),
      fill: rand() > .45 ? "#8b95a4" : "#161e2a",
      opacity: (.08 + rand() * .14).toFixed(2)
    }));
  }

  const roadside = document.getElementById("roadside");
  const PLANT_PERIOD = 320;

  function grassTuft(x, y, scale, flip) {
    const g = el("g", { transform: `translate(${x} ${y}) scale(${flip ? -scale : scale} ${scale})` });
    g.appendChild(el("path", {
      d: "M0 0 C-3 -15 -10 -25 -17 -33 C-4 -27 2 -17 4 -7 C6 -20 11 -32 20 -41 C13 -26 10 -13 10 0 Z",
      fill: "#38495a",
      opacity: ".95"
    }));
    g.appendChild(el("path", {
      d: "M3 0 C3 -13 8 -25 16 -34 C12 -21 11 -10 12 0 Z",
      fill: "#4a5b63",
      opacity: ".9"
    }));
    g.appendChild(el("path", {
      d: "M-2 0 C-7 -9 -12 -15 -20 -20 C-9 -18 -2 -11 1 -2 Z",
      fill: "#55656a",
      opacity: ".7"
    }));
    return g;
  }

  function daisy(x, y, scale, petal) {
    const g = el("g", { transform: `translate(${x} ${y}) scale(${scale})` });
    g.appendChild(el("path", {
      d: "M0 0 C-2 -13 0 -25 3 -36",
      fill: "none",
      stroke: "#3c4d52",
      "stroke-width": 2,
      "stroke-linecap": "round"
    }));
    g.appendChild(el("path", {
      d: "M2 -19 C8 -22 12 -20 14 -16 C9 -15 5 -16 2 -19 Z",
      fill: "#4a5c58"
    }));
    for (let i = 0; i < 7; i++) {
      const a = (i / 7) * Math.PI * 2;
      g.appendChild(el("ellipse", {
        cx: (3 + Math.cos(a) * 7).toFixed(2),
        cy: (-37 + Math.sin(a) * 7).toFixed(2),
        rx: 5.5,
        ry: 3.2,
        transform: `rotate(${(a * 180 / Math.PI).toFixed(1)} ${(3 + Math.cos(a) * 7).toFixed(2)} ${(-37 + Math.sin(a) * 7).toFixed(2)})`,
        fill: petal
      }));
    }
    g.appendChild(el("circle", { cx: 3, cy: -37, r: 4.2, fill: "#e0a04a" }));
    g.appendChild(el("circle", { cx: 1.8, cy: -38.4, r: 1.1, fill: "#ffd78b" }));
    return g;
  }

  for (let base = -PLANT_PERIOD * 2; base <= 1200 + PLANT_PERIOD * 2; base += PLANT_PERIOD) {
    const variant = ((base / PLANT_PERIOD) % 4 + 4) % 4;
    roadside.appendChild(grassTuft(base + 27, 607, .82 + variant * .03, false));
    roadside.appendChild(grassTuft(base + 104, 610, .63, true));
    roadside.appendChild(grassTuft(base + 215, 606, .9, false));
    roadside.appendChild(grassTuft(base + 292, 609, .66, true));
    roadside.appendChild(daisy(base + 65, 607, .8, variant % 2 ? "#f7e6c6" : "#f2dbb6"));
    roadside.appendChild(daisy(base + 251, 609, .66, "#f5e2bf"));
    roadside.appendChild(el("ellipse", {
      cx: base + 154,
      cy: 617,
      rx: 8,
      ry: 3.2,
      fill: "#5c5648",
      opacity: .4
    }));
    roadside.appendChild(el("ellipse", {
      cx: base + 169,
      cy: 621,
      rx: 4.5,
      ry: 2.2,
      fill: "#8b8168",
      opacity: .4
    }));
  }

  // ---------- articulated legs ----------
  const CRANK = { x: 620, y: 560 };
  const CRANK_R = 49;

  const rig = document.getElementById("bikeRig");
  const shadow = document.getElementById("bikeShadow");
  const rearWheel = document.getElementById("rearWheel");
  const frontWheel = document.getElementById("frontWheel");
  const chainring = document.getElementById("chainring");
  const chain = document.getElementById("chain");

  const near = {
    hip: { x: 601, y: 459 },
    legPath: document.getElementById("nearLegInner"),
    outline: document.getElementById("nearLegOutline"),
    shine: document.getElementById("nearLegShine"),
    knee: document.getElementById("nearKnee"),
    ankle: document.getElementById("nearAnkle"),
    foot: document.getElementById("nearFoot"),
    pedal: document.getElementById("nearPedal"),
    crankOutline: document.getElementById("nearCrankOutline"),
    crankBar: document.getElementById("nearCrankBar"),
    phase: 0
  };

  const far = {
    hip: { x: 575, y: 454 },
    legPath: document.getElementById("farLegInner"),
    outline: document.getElementById("farLegOutline"),
    knee: document.getElementById("farKnee"),
    ankle: document.getElementById("farAnkle"),
    foot: document.getElementById("farFoot"),
    pedal: document.getElementById("farPedal"),
    crankOutline: document.getElementById("farCrankOutline"),
    crankBar: document.getElementById("farCrankBar"),
    phase: Math.PI
  };

  const footShape = "M-7 2 C-10 -4 -2 -8 8 -7 L30 -5 L24 -1 L37 1 L22 4 L32 8 L12 8 C3 9 -4 7 -7 2 Z";
  function buildFoot(group, fill, dots) {
    group.appendChild(el("path", {
      d: footShape,
      fill: fill,
      stroke: "#161d29",
      "stroke-width": 2.8,
      "stroke-linejoin": "round"
    }));
    group.appendChild(el("path", {
      d: "M2 0 L23 0 M5 3 L21 6 M6 -3 L20 -4",
      fill: "none",
      stroke: "#a95e2f",
      "stroke-width": 1.4,
      "stroke-linecap": "round",
      opacity: dots
    }));
    group.appendChild(el("ellipse", {
      cx: 2,
      cy: 1,
      rx: 4,
      ry: 5,
      fill: "#cf8140",
      opacity: ".7"
    }));
  }
  buildFoot(near.foot, "#f2a856", ".65");
  buildFoot(far.foot, "#b06a3c", ".4");

  function solveLeg(leg, angle) {
    const pedalAngle = angle + leg.phase;
    const px = CRANK.x + Math.cos(pedalAngle) * CRANK_R;
    const py = CRANK.y + Math.sin(pedalAngle) * CRANK_R;
    const ax = px + 5;
    const ay = py - 9;

    // A stylised knee path keeps the leg readable: the knee travels forward
    // and lowers on the downstroke without ever locking into a straight line.
    const forward = Math.cos(pedalAngle);
    const lift = Math.sin(pedalAngle);
    const kx = leg.hip.x + 54 + 22 * forward;
    const ky = leg.hip.y + 46 + 27 * lift;

    const dPath = `M${leg.hip.x.toFixed(2)} ${leg.hip.y.toFixed(2)} L${kx.toFixed(2)} ${ky.toFixed(2)} L${ax.toFixed(2)} ${ay.toFixed(2)}`;
    leg.legPath.setAttribute("d", dPath);
    leg.outline.setAttribute("d", dPath);
    if (leg.shine) {
      const sx = leg.hip.x + (kx - leg.hip.x) * .55;
      const sy = leg.hip.y + (ky - leg.hip.y) * .55;
      leg.shine.setAttribute("d", `M${sx.toFixed(2)} ${sy.toFixed(2)} L${kx.toFixed(2)} ${ky.toFixed(2)}`);
    }
    leg.knee.setAttribute("cx", kx.toFixed(2));
    leg.knee.setAttribute("cy", ky.toFixed(2));
    leg.ankle.setAttribute("cx", ax.toFixed(2));
    leg.ankle.setAttribute("cy", ay.toFixed(2));

    const footTilt = Math.sin(pedalAngle) * 4.5 - 2;
    leg.foot.setAttribute("transform", `translate(${(px + 6).toFixed(2)} ${(py - 8).toFixed(2)}) rotate(${footTilt.toFixed(2)}) scale(1.08)`);

    leg.pedal.setAttribute("transform", `translate(${px.toFixed(2)} ${py.toFixed(2)})`);
    leg.crankOutline.setAttribute("x2", px.toFixed(2));
    leg.crankOutline.setAttribute("y2", py.toFixed(2));
    leg.crankBar.setAttribute("x2", px.toFixed(2));
    leg.crankBar.setAttribute("y2", py.toFixed(2));
  }

  // ---------- animation ----------
  let paused = false;
  let elapsed = 0;
  let lastTime = null;

  function setPaused(value) {
    paused = value;
    stage.classList.toggle("is-paused", paused);
    toggle.setAttribute("aria-label", paused ? "播放动画" : "暂停动画");
    toggle.title = paused ? "播放动画（空格）" : "暂停动画（空格）";
    toggleLabel.textContent = paused ? "播放" : "暂停";
    if (!paused) lastTime = performance.now();
  }

  function togglePause() {
    setPaused(!paused);
  }

  function render(t) {
    const bob = Math.sin(t * 4.15) * 2.1 + Math.sin(t * 1.37) * .8;
    const lean = Math.sin(t * 4.15 + .7) * .22;
    rig.setAttribute("transform", `translate(0 ${bob.toFixed(2)}) rotate(${lean.toFixed(2)} 640 670)`);
    const shadowScale = 1 + Math.sin(t * 4.15) * .012;
    shadow.setAttribute("transform", `translate(638 674) scale(${shadowScale.toFixed(3)} 1) translate(-638 -674)`);

    const wheelDeg = (t * 430) % 360;
    rearWheel.setAttribute("transform", `rotate(${wheelDeg.toFixed(2)} 452 556)`);
    frontWheel.setAttribute("transform", `rotate(${wheelDeg.toFixed(2)} 826 556)`);

    const crankAngle = t * 2.9;
    const crankDeg = (crankAngle * 180 / Math.PI) % 360;
    chainring.setAttribute("transform", `rotate(${crankDeg.toFixed(2)} 620 560)`);
    chain.style.strokeDashoffset = (-crankDeg * .62).toFixed(2);

    solveLeg(near, crankAngle);
    solveLeg(far, crankAngle);

    const dashShift = (t * 220) % DASH_PERIOD;
    dashes.setAttribute("transform", `translate(${(-dashShift).toFixed(2)} 0)`);

    const plantShift = (t * 118) % PLANT_PERIOD;
    roadside.setAttribute("transform", `translate(${(-plantShift).toFixed(2)} 0)`);
  }

  function tick(now) {
    if (lastTime === null) lastTime = now;
    const dt = Math.min((now - lastTime) / 1000, .05);
    lastTime = now;
    if (!paused) elapsed += dt;
    render(elapsed);
    window.requestAnimationFrame(tick);
  }

  toggle.addEventListener("click", togglePause);

  document.addEventListener("keydown", (event) => {
    const tag = (event.target && event.target.tagName) || "";
    if (event.code === "Space" && tag !== "BUTTON" && tag !== "INPUT" && tag !== "TEXTAREA") {
      event.preventDefault();
      if (!event.repeat) togglePause();
    } else if ((event.key === "p" || event.key === "P") && !event.metaKey && !event.ctrlKey && !event.altKey) {
      togglePause();
    }
  });

  if (reduceMotion.matches) setPaused(true);
  else setPaused(false);

  render(elapsed);
  window.requestAnimationFrame(tick);
})();
</script>
</body>
</html>
